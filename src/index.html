<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Pulidor de Prompts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: una sola columna centrada. Inicio = titular + caja tipo cápsula; conversación = tarjetas del motor arriba y caja fija abajo; historial en panel lateral. Blanco y negro. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --sunk:#F5F5F4; --ink:#0B0B0B; --muted:#76767A; --faint:#B4B4B8; --line:#E9E9EA;
  --solid:#0B0B0B; --solid-ink:#FFFFFF; --glow:#EDEDEE; --scrim:rgba(10,10,10,.18);
  --shadow:0 1px 2px rgba(0,0,0,.04), 0 8px 28px -6px rgba(0,0,0,.10);
  --f-display:"Instrument Serif", "Times New Roman", Georgia, serif;
  --f-body:"Geist", "Helvetica Neue", Arial, system-ui, sans-serif;
  --f-mono:"Geist Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A0A0A; --surface:#131313; --sunk:#1C1C1D; --ink:#F3F3F3; --muted:#8C8C90; --faint:#55555A; --line:#262628;
    --solid:#F3F3F3; --solid-ink:#0A0A0A; --glow:#1B1B1C; --scrim:rgba(0,0,0,.55);
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 30px -8px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A0A0A; --surface:#131313; --sunk:#1C1C1D; --ink:#F3F3F3; --muted:#8C8C90; --faint:#55555A; --line:#262628;
  --solid:#F3F3F3; --solid-ink:#0A0A0A; --glow:#1B1B1C; --scrim:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 30px -8px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{min-height:100%;display:flex;flex-direction:column;padding-inline:20px;position:relative;isolation:isolate}
.app::before{content:"";position:fixed;inset:-20% -10% auto;height:70vh;z-index:-1;pointer-events:none;
  background:radial-gradient(50% 60% at 50% 40%, var(--glow), transparent 70%)}

/* Barra superior */
.top{display:flex;align-items:center;justify-content:space-between;padding-block:18px;max-width:760px;width:100%;margin:0 auto}
.top-left,.top-actions{display:flex;align-items:center;gap:4px}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:.95rem;letter-spacing:-.01em;margin-left:6px}
.mark{width:18px;height:18px;border-radius:50% 50% 50% 4px;background:var(--solid);flex:none}
.ghost{font-size:.86rem;color:var(--muted);padding:6px 10px;border-radius:99px}
.ghost:hover{color:var(--ink);background:var(--sunk)}
.icon-btn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--muted);transition:color .15s,background .15s;flex:none}
.icon-btn:hover{color:var(--ink);background:var(--sunk)}
.icon-btn svg{width:18px;height:18px}

/* Inicio */
.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-block:4vh 6vh;max-width:680px;width:100%;margin:0 auto;text-align:center}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(2.6rem,7vw,4.2rem);line-height:1;letter-spacing:-.02em;margin:0;text-wrap:balance}
.hero .lede{margin:12px auto 0;color:var(--muted);max-width:44ch;font-size:1rem;text-wrap:balance}
.foot{font-size:.78rem;color:var(--faint);max-width:52ch;text-wrap:balance;margin:22px auto 48px;text-align:center}

/* Conversación */
.thread{flex:1;max-width:680px;width:100%;margin:0 auto;padding-block:8px 24px;display:flex;flex-direction:column;gap:22px}
.u{align-self:flex-end;max-width:85%;background:var(--sunk);padding:10px 15px;border-radius:18px 18px 4px 18px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:14em;overflow:hidden;position:relative}
.u.long::after{content:"";position:absolute;inset:auto 0 0;height:3em;background:linear-gradient(transparent,var(--sunk))}
.a{display:grid;grid-template-columns:22px minmax(0,1fr);gap:12px;align-items:start}
.a .mark{width:16px;height:16px;margin-top:4px}
.a .text{white-space:pre-wrap;overflow-wrap:anywhere}
.shimmer{background:linear-gradient(90deg,var(--faint) 0%,var(--ink) 50%,var(--faint) 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 1.6s linear infinite}
@keyframes sh{from{background-position:100% 0}to{background-position:-100% 0}}

/* "Entendí" */
.understood{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:12px}
.understood .label{margin-right:2px}
.tag{font-size:.8rem;padding:4px 10px;border-radius:99px;background:var(--sunk);color:var(--ink);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.select-wrap{position:relative;display:inline-flex}
.select-wrap select{appearance:none;-webkit-appearance:none;font:inherit;font-size:.8rem;color:var(--solid-ink);background:var(--solid);border:0;border-radius:99px;padding:4px 28px 4px 11px;cursor:pointer}
.select-wrap::after{content:"";position:absolute;right:11px;top:50%;width:6px;height:6px;border-right:1.5px solid var(--solid-ink);border-bottom:1.5px solid var(--solid-ink);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.tag.type{background:var(--solid);color:var(--solid-ink)}

/* Preguntas */
.qs{margin-top:16px;display:flex;flex-direction:column;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.q-label{font-size:.88rem;font-weight:500;margin:0 0 7px}
.q-note{font-size:.82rem;color:var(--muted);margin:-3px 0 7px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{font-size:.82rem;padding:6px 12px;border:1px solid var(--line);border-radius:99px;background:var(--surface);transition:border-color .15s,background .15s,color .15s}
.opt:hover{border-color:var(--ink)}
.opt[aria-pressed="true"]{background:var(--solid);color:var(--solid-ink);border-color:var(--solid)}
.opt.skip{border-style:dashed;color:var(--muted)}
.opt.skip[aria-pressed="true"]{background:var(--sunk);color:var(--ink);border-color:var(--faint)}
.other{display:flex;gap:6px;margin-top:8px}
.other input{flex:1;min-width:0;font:inherit;font-size:.86rem;padding:7px 12px;border:1px solid var(--line);border-radius:99px;background:var(--sunk);color:var(--ink);outline:none}
.other input:focus{border-color:var(--faint)}

/* Cambios */
.changes{margin-top:12px;font-size:.84rem;color:var(--muted)}
.changes summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:6px;padding:4px 0}
.changes summary::-webkit-details-marker{display:none}
.changes summary::before{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:transform .15s}
.changes[open] summary::before{transform:rotate(45deg)}
.changes ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px}

/* Resultado */
.result{margin-top:14px;border:1px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden}
.result-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 10px 10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.result-actions{display:flex;gap:6px;align-items:center}
.label{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.result pre{margin:0;padding:16px;font-family:var(--f-mono);font-size:.84rem;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}
.result.claude{border-style:dashed}
.hole{background:var(--sunk);border-bottom:1px dashed var(--muted);padding:0 3px;border-radius:3px}
.pill-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--solid);color:var(--solid-ink);font-size:.8rem;font-weight:500;padding:6px 12px;border-radius:99px}
.pill-btn svg{width:14px;height:14px}
.line-btn{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;padding:5px 12px;border:1px solid var(--line);border-radius:99px;color:var(--ink)}
.line-btn:hover:not(:disabled){border-color:var(--ink)}
.line-btn:disabled{color:var(--muted)}
.note{font-size:.82rem;color:var(--muted);margin-top:8px}

/* Caja de texto */
.dock{width:100%;max-width:680px;margin:0 auto}
.app.chatting .dock{position:sticky;bottom:0;padding-block:12px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 72%,transparent)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);text-align:left;transition:border-color .15s}
.box:focus-within{border-color:var(--faint)}
.box textarea{display:block;width:100%;border:0;background:transparent;resize:none;padding:16px 18px 6px;font:inherit;font-size:1rem;line-height:1.5;color:var(--ink);min-height:56px;max-height:38vh;outline:none}
.box textarea::placeholder{color:var(--faint)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px 8px 12px}
.checks{display:flex;align-items:center;gap:4px;flex-wrap:wrap;min-width:0}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted);padding:5px 9px;border-radius:99px;transition:color .2s,background .2s}
.chk:hover{background:var(--sunk);color:var(--ink)}
.chk.ok{color:var(--ink)}
.d{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--faint);flex:none;transition:all .2s}
.chk.ok .d,.row.ok .d{background:var(--solid);border-color:var(--solid)}
.chk.parcial .d,.row.parcial .d{border-color:var(--ink);background:linear-gradient(90deg,var(--ink) 50%,transparent 50%)}
.row.opcional .d,.row.na .d{border-style:dashed}
.send{width:36px;height:36px;border-radius:50%;background:var(--solid);color:var(--solid-ink);display:grid;place-items:center;flex:none;transition:opacity .15s,transform .15s}
.send:disabled{opacity:.25}
.send:not(:disabled):active{transform:scale(.94)}
.send svg{width:18px;height:18px}
.detail{border-top:1px solid var(--line);padding:6px 18px 14px;display:grid;grid-template-columns:1fr 1fr;gap:4px 24px}
.detail h3{grid-column:1/-1;margin:10px 0 2px;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.row{display:grid;grid-template-columns:14px minmax(0,1fr);gap:8px;padding:6px 0;align-items:start}
.row .d{margin-top:6px}
.row b{font-weight:500;font-size:.88rem}
.row span{display:block;color:var(--muted);font-size:.82rem;line-height:1.4}
.tips{grid-column:1/-1;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.tips li{font-size:.84rem;color:var(--muted)}
.tips li b{color:var(--ink);font-weight:500}
.hint{min-height:1.4em;margin:10px 4px 0;font-size:.82rem;color:var(--muted);text-align:center}
.hint b{color:var(--ink);font-weight:500}

/* Historial */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(320px,86vw);z-index:21;background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;transform:translateX(-102%);transition:transform .25s ease;visibility:hidden;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.open{transform:none;box-shadow:var(--shadow);visibility:visible}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:16px 12px 8px 20px}
.drawer-head h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:1.6rem;letter-spacing:-.01em}
.drawer .new{margin:4px 16px 12px;padding:9px 14px;font-size:.86rem}
.chats{flex:1;overflow-y:auto;list-style:none;margin:0;padding:0 8px 12px}
.group{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:14px 12px 6px}
.chat{display:flex;align-items:center;gap:4px;border-radius:10px}
.chat:hover,.chat.active{background:var(--sunk)}
.chat .open-chat{flex:1;min-width:0;text-align:left;padding:9px 12px}
.chat .t{display:block;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat .when{display:block;font-size:.76rem;color:var(--muted);font-variant-numeric:tabular-nums}
.chat .del{opacity:0;font-size:.76rem;color:var(--muted);padding:6px 8px;border-radius:8px;margin-right:4px;flex:none}
.chat:hover .del,.chat:focus-within .del,.chat .del.confirm{opacity:1}
.chat .del:hover{color:var(--ink)}
.chat .del.confirm{background:var(--solid);color:var(--solid-ink)}
.empty{padding:20px;color:var(--muted);font-size:.86rem;text-wrap:balance}
.drawer-foot{border-top:1px solid var(--line);padding:12px 16px 14px;display:flex;flex-direction:column;gap:10px}
.store-note{font-size:.76rem;color:var(--muted);margin:0 4px}
.foot-actions{display:flex;gap:6px;flex-wrap:wrap}
.app-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.76rem;color:var(--muted);margin-left:4px;font-variant-numeric:tabular-nums}
.banner{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:30;width:min(560px,calc(100% - 32px));
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 10px 10px 16px;border-radius:16px;
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);font-size:.86rem}
.banner-actions{display:flex;gap:6px}
@media (hover:none){.chat .del{opacity:1}}

@media (max-width:620px){ .detail{grid-template-columns:1fr} .qs{padding:12px} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.shimmer{color:var(--muted);background:none}}
</style>
</head>
<body>


<div class="app" id="app">
  <div class="top">
    <div class="top-left">
      <button class="icon-btn" id="btn-history" type="button" aria-label="Abrir historial" aria-controls="drawer" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg>
      </button>
      <div class="brand"><span class="mark" aria-hidden="true"></span>Pulidor de Prompts</div>
    </div>
    <div class="top-actions">
      <button class="ghost" id="btn-reset" type="button" hidden>Nuevo prompt</button>
      <button class="icon-btn" id="btn-theme" type="button" aria-label="Cambiar a modo oscuro"></button>
    </div>
  </div>

  <section class="hero" id="hero">
    <div>
      <h1>Pide mejor.</h1>
      <p class="lede">Escribe tu pedido. Te pregunto lo que falta y te lo devuelvo listo para Claude.</p>
    </div>
  </section>

  <section class="thread" id="thread" hidden aria-live="polite"></section>

  <div class="dock" id="dock">
    <form class="box" id="composer">
      <label for="draft" class="sr">Lo que quieres pedirle a Claude</label>
      <textarea id="draft" name="draft" rows="1" placeholder="¿Qué le quieres pedir a Claude?"></textarea>
      <div class="detail" id="detail" hidden></div>
      <div class="bar">
        <div class="checks" id="checks"></div>
        <button class="send" id="btn-send" type="submit" aria-label="Pulir prompt" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>
    </form>
    <p class="hint" id="hint"></p>
  </div>

  <p class="foot" id="foot">Funciona sin IA, con reglas basadas en las buenas prácticas de Anthropic. Claude solo entra si eliges comparar, y usa tu cuenta.</p>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Historial">
  <div class="drawer-head">
    <h2>Historial</h2>
    <button class="icon-btn" id="btn-close" type="button" aria-label="Cerrar historial">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <button class="pill-btn new" id="btn-new" type="button">Nuevo prompt</button>
  <ul class="chats" id="chats"></ul>
  <div class="drawer-foot">
    <p class="store-note" id="store-note">Cargando historial…</p>
    <div class="foot-actions">
      <button class="line-btn" id="btn-export" type="button" hidden>Exportar historial</button>
      <button class="line-btn" id="btn-import" type="button">Importar</button>
      <input type="file" id="import-file" accept=".json,application/json" hidden>
    </div>
    <div class="app-meta" id="app-meta" hidden>
      <span id="app-version"></span>
      <button class="ghost" id="btn-update" type="button">Buscar actualización</button>
    </div>
  </div>
</aside>

<div class="banner" id="banner" role="status" hidden>
  <span id="banner-text"></span>
  <div class="banner-actions" id="banner-actions"></div>
</div>

<script>
// ===== Motor de reglas del Pulidor de Prompts (sin IA) =====
// Entrada: texto del usuario + respuestas a preguntas + tipo forzado (opcional).
// Salida: tipo detectado, datos detectados, preguntas pendientes, prompt armado, checklist y cambios aplicados.
const Engine = (() => {
  // --- Texto plegado (sin tildes, minúsculas) con la MISMA longitud que el original ---
  function fold(s) {
    let out = "";
    for (const ch of s) {
      if (ch.length !== 1) { out += ch; continue; }
      const b = ch.normalize("NFD")[0].toLowerCase();
      out += b.length === 1 ? b : ch;
    }
    return out;
  }
  const T = (o) => ({ o, s: fold(o) });
  function grab(t, re, g = 1) {
    const m = re.exec(t.s);
    if (!m || !m.indices || !m.indices[g]) return null;
    const [a, b] = m.indices[g];
    return t.o.slice(a, b).trim();
  }
  const cap = (s) => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
  const low = (s) => s ? s.charAt(0).toLowerCase() + s.slice(1) : s;
  const endDot = (s) => /[.!?:…)]$/.test(s) ? s : s + ".";
  const has = (hay, needle) => fold(hay).includes(fold(needle));
  const clean = (s) => s.replace(/\s+/g, " ").replace(/\s+([,.;:])/g, "$1").trim();

  // --- Verbos: infinitivo, subjuntivo (tú), imperativo. Marca 1 = verbo genérico (se reemplaza por el del tipo) ---
  const VERB_LIST = [
    ["hacer","hagas","Haz",1],["dar","des","Da",1],["ayudar","ayudes","Ayuda",1],
    ["escribir","escribas","Escribe"],["redactar","redactes","Redacta"],["crear","crees","Crea"],["armar","armes","Arma"],
    ["generar","generes","Genera"],["resumir","resumas","Resume"],["analizar","analices","Analiza"],["traducir","traduzcas","Traduce"],
    ["corregir","corrijas","Corrige"],["revisar","revises","Revisa"],["disenar","disenes","Diseña"],["preparar","prepares","Prepara"],
    ["explicar","expliques","Explica"],["decir","digas","Di"],["mejorar","mejores","Mejora"],["proponer","propongas","Propón"],
    ["sugerir","sugieras","Sugiere"],["buscar","busques","Busca"],["comparar","compares","Compara"],["organizar","organices","Organiza"],
    ["planificar","planifiques","Planifica"],["elaborar","elabores","Elabora"],["convertir","conviertas","Convierte"],["calcular","calcules","Calcula"],
    ["recomendar","recomiendes","Recomienda"],["evaluar","evalues","Evalúa"],["listar","listes","Lista"],["desarrollar","desarrolles","Desarrolla"],
    ["programar","programes","Programa"],["optimizar","optimices","Optimiza"],["reescribir","reescribas","Reescribe"],["investigar","investigues","Investiga"],
    ["plantear","plantees","Plantea"],["inventar","inventes","Inventa"],["describir","describas","Describe"],["ensenar","ensenes","Enseña"],
    ["responder","respondas","Responde"],["contestar","contestes","Contesta"],["estructurar","estructures","Estructura"],["sintetizar","sintetices","Sintetiza"],
    ["parafrasear","parafrasees","Parafrasea"],["editar","edites","Edita"],["pasar","pases","Pasa",1],["mandar","mandes","Escribe",1],["enviar","envies","Escribe",1]
  ];
  const VERBS = new Map();
  for (const [inf, subj, imp, gen] of VERB_LIST) {
    const rec = { imp, gen: !!gen };

    else if (/^(que es|como funciona|por que|cual es|cuales son|como se)\b/.test(t.s)) { imp = "Explica"; rest = low(t.o); }
    else imp = tv;
    rest = rest.replace(/^(me|nos|le|les)\s+/i, "");
    return { imp, rest, found: !!verb || type !== "otro" };
  }

  // --- Clasificar tipo ---
  function classify(fs) {
    let best = "otro", score = 0;
    for (const k of TYPE_ORDER) {
      const sc = TYPES[k].kw.reduce((n, re) => n + (re.test(fs) ? 1 : 0), 0);
      if (sc > score) { best = k; score = sc; }
    }
    return best;
  }

  // --- Motor principal ---
  function run(input, answers = {}, forcedType = null) {
    const changes = new Set();
    const raw = (input || "").trim();
    const { material, rest } = extractMaterial(raw, changes);
    const tidied = tidy(rest, changes);
    const full = T(tidied);
    const autoType = classify(full.s);
    const type = forcedType && TYPES[forcedType] ? forcedType : autoType;
    const def = TYPES[type];

    // Frases: separar por punto, salto de línea o punto y coma
    let clauses = tidied.split(/(?<=[.!?;])\s+|\n+/).map(s => s.trim()).filter(Boolean);
    // quitar saludos, "por favor" y pedidos de verificación
    const kept = [];
    let removedThink = false, removedFiller = false;
    for (const c of clauses) {
      const fc = fold(c).replace(/[¿¡]/g, "");
      if (FILLER.test(fc)) { removedFiller = true; continue; }
      if (OVERTHINK.test(fc) && fc.length < 120) { removedThink = true; continue; }
      kept.push(c.replace(/,?\s*\b(porfa(?:vor)?|por favor|pls|plis)\b[,!]?/gi, "").replace(/^\s*(hola|oye|buenas)[,!\s]+/i, "").trim());
    }
    if (removedThink) changes.add("Quité \"piensa paso a paso\" o \"verifica\": los modelos actuales ya lo hacen solos y pedirlo solo los hace más lentos.");
    if (removedFiller) changes.add("Quité saludos y frases de cortesía: no cambian el resultado.");
    clauses = kept.filter(Boolean);

    // Encontrar la frase de tarea
    const verbAt = (c) => {
      const f = fold(c).replace(/^[¿¡\s]+/, "");
      const pm = POLITE.exec(f); const after = f.slice(pm ? pm[0].length : 0);
      const w = /^([a-z]+)\b/.exec(after);
      return (w && lookupVerb(w[1])) || /^(que es|como funciona|por que|cual es|cuales son)\b/.test(after) || (pm && pm[0].length > 0 && /(quiero|necesito|busco|quisiera)/.test(pm[0]));
    };
    let ti = clauses.findIndex(verbAt);
    if (ti === -1) ti = clauses.findIndex(c => def.kw.some(re => re.test(fold(c))));
    let taskClause = ti >= 0 ? clauses[ti] : null;
    let extra = [];
    if (taskClause) {
      // cortar la frase de tarea en la primera coma o "que sean…": lo que sigue se procesa aparte
      const cut = /,|;|\s+y\s+que\s+|\s+que\s+(?:sea|sean|tenga|tengan|suene|suenen)\s+|\s+con\s+(?:un\s+)?tono\s+/i.exec(taskClause);
      if (cut && cut.index > 8) {
        extra = [taskClause.slice(cut.index).replace(/^[,;\s]+|^\s*y\s+/i, "").trim()];
        taskClause = taskClause.slice(0, cut.index).trim();
      }
      clauses = [...clauses.slice(0, ti), ...extra, ...clauses.slice(ti + 1)];
    }

    // Detectar datos (en todo el texto) y aplicar respuestas
    const detected = {}, values = {};
    for (const k of Object.keys(SLOTS)) {
      if (SLOTS[k].special) continue;
      const v = SLOTS[k].detect(full);
      if (v) detected[k] = v;
    }
    if (material) detected.material = material;
    const negocio = detectNegocio(full);
    for (const k of def.slots) {
      const a = answers[k];
      if (a === "__skip") values[k] = { state: "skip" };
      else if (a) values[k] = { state: "answer", v: a };
      else if (detected[k]) values[k] = { state: "detected", v: detected[k] };
      else values[k] = { state: "pending" };
    }
    // datos detectados fuera de los slots del tipo también se usan (si el usuario los dijo)
    for (const k of Object.keys(detected)) if (!values[k] && k !== "material" && k !== "cantidad") values[k] = { state: "detected", v: detected[k], extra: true };
    if (!values.cantidad && detected.cantidad) values.cantidad = { state: "detected", v: detected.cantidad, extra: true };

    // Clasificar el resto de frases: reglas o contexto
    const ctxPieces = [], rules = [];
    let negConverted = 0;
    for (const c of clauses) {
      if (c === taskClause) continue;
      const ct = T(c), f = ct.s.replace(/^[¿¡\s]+/, "");
      const isRule = RULE_START.test(f) || /\bno\s+(uses|pongas|hagas|incluyas|escribas|menciones|agregues|anadas|repitas|inventes|seas|sea|sean)\b/.test(f);
      const hitsOut = OUT_SLOTS.some(k => SLOTS[k].detect(ct));
      const hitsCtx = CTX_SLOTS.some(k => SLOTS[k].detect(ct));
      if (hitsOut && f.length < 45 && !isRule) continue; // frase corta tipo "tono divertido" o "en una tabla": ya está en Entrega
      if (isRule) {
        const neg = NEG_RULES.find(([re]) => re.test(f));
        if (hitsOut && (!neg || f.length < 60)) continue; // ya está en Entrega
        if (neg) { rules.push(neg[1]); negConverted++; continue; }
        rules.push(endDot(cap(c.replace(/^\s*(y|e)\s+/i, ""))));
      } else {
        if (hitsCtx && /^(para|dirigid|a\s|el publico|mi publico|publico)/.test(f) && f.length < 70) continue; // ya está en Contexto
        if (taskClause === null && verbAt(c)) continue;
        ctxPieces.push(endDot(cap(c)));
      }
    }
    if (negConverted) changes.add(negConverted === 1 ? "Pasé una instrucción negativa a positiva: Claude rinde mejor cuando le dices qué hacer." : "Pasé " + negConverted + " instrucciones negativas a positivas: Claude rinde mejor cuando le dices qué hacer.");

    // --- Armar secciones ---
    const ctx = [];
    if (negocio && !ctxPieces.some(p => has(p, negocio.replace(/^Tengo (una|un) /, "")))) ctx.push({ text: endDot(negocio), real: true });
    ctxPieces.forEach(p => ctx.push({ text: p, real: true }));
    const out = [], holes = [];
    const allSlotKeys = [...def.slots, ...Object.keys(values).filter(k => !def.slots.includes(k))];
    for (const k of allSlotKeys) {
      const s = SLOTS[k], val = values[k];
      if (!s || s.special || !val || k === "cantidad") continue;
      if (s.sec === "ctx") {
        if (val.v) { if (!ctx.some(p => has(p.text, val.v))) ctx.push({ text: endDot(s.render(val.v)), real: true }); }
        else if (val.state === "pending" && s.hole) { ctx.push({ text: endDot(s.hole), real: false }); holes.push(k); }
      } else if (s.sec === "out") {
        if (val.v) out.push({ text: s.render(val.v), real: true });
        else if (val.state === "pending" && s.hole) { out.push({ text: s.hole, real: false }); holes.push(k); }
      }
    }

    // Tarea
    let taskText, taskFound = false;
    if (taskClause) {
      const n = normTask(taskClause, type, changes);
      taskFound = n.found;
      let r = n.rest;
      const qty = values.cantidad && values.cantidad.v;
      if (qty) {
        if (/^(unos|unas|algunos|algunas|un par de|varios|varias)\s+/i.test(r)) r = r.replace(/^(unos|unas|algunos|algunas|un par de|varios|varias)\s+/i, qty + " ");
        else if (!/\d/.test(r) && !/^(un|una|el|la)\s/i.test(r)) r = qty + " " + r;
      } else r = r.replace(/^(unos|unas|algunos|algunas|varios|varias)\s+/i, "");
      // "traduce esto" / "resume este documento" → apuntar al material
      if (material || def.slots.includes("material")) {
        if (/^\s*$/.test(r)) r = "el texto de <material>";
        else r = r.replace(/^(esto|este texto|lo siguiente|el siguiente texto|este documento|este correo|este mensaje|este parrafo|este párrafo)\b/i, "el texto de <material>");
      }
      taskText = clean(n.imp + " " + r);
    } else {
      taskText = def.verb + " [qué necesitas exactamente]";
    }
    for (const k of def.slots) {
      const s = SLOTS[k], val = values[k];
      if (!s || s.sec !== "task" || k === "cantidad") continue;
      if (val.v) { if (!has(taskText, val.v)) taskText += " " + s.render(val.v); }
      else if (val.state === "pending" && s.hole) { taskText += " " + s.hole; holes.push(k); }
    }
    for (const k of Object.keys(values)) {
      if (def.slots.includes(k)) continue;
      const s = SLOTS[k], val = values[k];
      if (s && s.sec === "task" && val.v && k !== "cantidad" && !has(taskText, val.v)) taskText += " " + s.render(val.v);
    }
    if (values.cantidad && values.cantidad.state === "answer" && !taskClause) taskText = taskText.replace("[qué necesitas exactamente]", values.cantidad.v + " [qué necesitas exactamente]");
    // nombres propios bien escritos (instagram → Instagram, python → Python)
    for (const k of ["red", "lenguaje"]) {
      const val = values[k];
      if (val && val.v) taskText = taskText.replace(new RegExp("\\b" + fold(val.v).replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\b", "i"), val.v);
    }
    taskText = endDot(cap(clean(taskText)));

    // Material
    const needsMat = def.slots.includes("material");
    let matText = null;
    if (material) matText = material;
    else if (needsMat) { matText = SLOTS.material.hole; holes.push("material"); }

    // --- Prompt final ---
    const lines = [];
    if (matText) lines.push("<material>\n" + matText + "\n</material>", "");
    lines.push("Contexto: " + (ctx.length ? ctx.map(p => p.text).join(" ") : "[quién eres, para quién es y para qué]"));
    lines.push("Tarea: " + taskText);
    lines.push("Entrega: " + (out.length ? out.map(p => endDot(p.text)).join(" ") : "[formato, extensión y tono]"));
    if (rules.length) lines.push("Reglas:\n" + [...new Set(rules)].map(r => "- " + endDot(r)).join("\n"));
    const prompt = lines.join("\n");

    // --- Preguntas pendientes ---
    const questions = def.slots.filter(k => values[k] && (values[k].state === "pending" || values[k].state === "answer" || values[k].state === "skip") && !(values[k].state === "detected"))
      .map(k => ({ key: k, q: SLOTS[k].q, opts: SLOTS[k].opts, state: values[k].state, value: values[k].v || null, special: !!SLOTS[k].special }));
    // si hay material detectado, no preguntar por él
    const qs = questions.filter(q => !(q.key === "material" && material));

    // --- Datos entendidos (para mostrar) ---
    const understood = [];
    if (negocio) understood.push(negocio.replace(/^Tengo /, ""));
    for (const k of Object.keys(values)) if (values[k].state === "detected" && k !== "material") understood.push((k === "cantidad" ? values[k].v + " en total" : values[k].v));
    if (material) understood.push("Texto pegado (" + material.length + " caracteres)");
    // quitar repetidos (si uno ya está contenido en otro)
    const uniq = understood.filter((u, i) => !understood.some((o, j) => j !== i && o.length > u.length && has(o, u)));
    understood.length = 0; uniq.forEach(u => understood.push(u));

    // --- Checklist ---
    const realCtx = ctx.filter(p => p.real).length, realOut = out.filter(p => p.real).length;
    const checks = {
      tarea: taskClause ? { estado: "ok", nota: "Pedido directo con verbo de acción." } : raw ? { estado: "parcial", nota: "No encontré qué quieres exactamente." } : { estado: "falta", nota: "Di qué quieres con un verbo de acción." },
      contexto: realCtx >= 2 ? { estado: "ok", nota: "Claude sabe para quién y para qué." } : realCtx === 1 ? { estado: "parcial", nota: "Suma para quién es o para qué lo usarás." } : { estado: "falta", nota: "Cuenta quién eres, para quién es y para qué." },
      entrega: realOut >= 2 ? { estado: "ok", nota: "Claude sabe cómo entregarlo." } : realOut === 1 ? { estado: "parcial", nota: "Suma extensión, formato o tono." } : { estado: "falta", nota: "Define formato, extensión y tono." },
      material: material ? { estado: "ok", nota: "Va arriba, dentro de <material>." } : needsMat ? { estado: "falta", nota: "Pega el texto que Claude debe usar." } : { estado: "na", nota: "Solo si pegas documentos o datos." },
      reglas: rules.length ? { estado: "ok", nota: rules.length + (rules.length === 1 ? " regla, en positivo." : " reglas, en positivo.") } : { estado: "opcional", nota: "Solo si Claude repite un error." },
      ejemplos: /\bejemplos?\b|<ejemplo/.test(full.s) ? { estado: "ok", nota: "Incluyes ejemplos de referencia." } : { estado: "opcional", nota: "Si importa un tono o formato exacto." }
    };

    return { type, autoType, typeLabel: def.label, prompt, questions: qs, understood, checks, changes: [...changes], holes: [...new Set(holes)], hasTask: !!taskClause };
  }

  function types() { return Object.entries(TYPES).map(([k, v]) => ({ key: k, label: v.label })); }
  return { run, types, fold };
})();
if (typeof module !== "undefined") module.exports = Engine;

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const TAURI = window.__TAURI__ || null;
  const IS_APP = !!(TAURI && TAURI.core);
  const app = $("app"), hero = $("hero"), foot = $("foot"), thread = $("thread");
  if (IS_APP) foot.textContent = "Funciona sin internet y sin IA, con reglas basadas en las buenas prácticas de Anthropic.";
  const draftEl = $("draft"), sendBtn = $("btn-send"), detailEl = $("detail"), checksEl = $("checks"), hintEl = $("hint");

  const ITEMS = {
    contexto: { name: "Contexto", core: true, desc: "Quién eres, para quién es y para qué." },
    tarea:    { name: "Tarea", core: true, desc: "Qué quieres, con un verbo de acción." },
    entrega:  { name: "Entrega", core: true, desc: "Formato, extensión, tono y qué es terminado." },
    material: { name: "Material", core: false, desc: "Texto largo o pegado: arriba, en <material>." },
    reglas:   { name: "Reglas en positivo", core: false, desc: "Solo si Claude repite un error." },
    ejemplos: { name: "Ejemplos", core: false, desc: "Si importa un formato o tono exacto." }
  };
  const CORE = ["contexto", "tarea", "entrega"];

  function warnings(raw) {
    const w = [];
    if (!raw.trim()) return w;
    const caps = (raw.match(/\b[A-ZÁÉÍÓÚÑ]{4,}\b/g) || []).filter(x => !/^(JSON|HTML|PDF|SEO|CSV|API|URL|PYME|LATAM)$/.test(x));
    if (caps.length >= 2 || /\b(CRÍTICO|CRITICO|IMPORTANTE|SIEMPRE|NUNCA|DEBES)\b/.test(raw))
      w.push(["Sin mayúsculas ni urgencia.", " Igual lo limpio al pulir, pero pídelo normal."]);
    const negs = (raw.match(/\bno\s+(uses|pongas|hagas|incluyas|escribas|menciones|agregues|añadas|des|seas)\b|\bevita\b|\bnunca\b/gi) || []).length;
    if (negs >= 2) w.push(["Di qué hacer, no qué evitar.", " En vez de \"no uses listas\", pide \"en párrafos\"."]);
    if (/paso a paso|piensa (bien|con cuidado|detenidamente)|verifica|revisa dos veces|double[- ]?check/i.test(raw))
      w.push(["No pidas que piense o verifique.", " Ya lo hace solo; pedirlo lo hace más lento."]);
    return w;
  }

  // ---------- Estado ----------
  // chat v2 = { v:2, id, title, createdAt, updatedAt, request, type, answers:{}, turns:[{ text, prompt, label, claude? }] }
  let chat = null, detailOpen = false, sampleFn = undefined, lastResult = null;
  const runEngine = (extraText = "") => Engine.run([chat ? chat.request : "", extraText].filter(s => s && s.trim()).join("\n\n"), chat ? chat.answers : {}, chat ? chat.type : null);

  // ---------- Checklist en la caja ----------
  function render() {
    const draft = draftEl.value;
    const hasText = !!(draft.trim() || (chat && chat.request));
    const r = hasText ? runEngine(draft) : null;
    const c = r ? r.checks : null;

    checksEl.replaceChildren(...CORE.map(k => {
      const b = document.createElement("button");
      b.type = "button";
      const st = c ? c[k].estado : "falta";
      b.className = "chk " + st;
      b.setAttribute("aria-expanded", String(detailOpen));
      b.title = c ? c[k].nota : ITEMS[k].desc;
      const d = document.createElement("span"); d.className = "d";
      const l = document.createElement("span"); l.textContent = ITEMS[k].name;
      b.append(d, l);
      b.onclick = () => { detailOpen = !detailOpen; render(); };
      return b;
    }));

    if (detailOpen) {
      const nodes = [];
      const h = (txt) => { const e = document.createElement("h3"); e.textContent = txt; return e; };
      const row = (k) => {
        const s = c ? c[k] : { estado: ITEMS[k].core ? "falta" : "opcional", nota: ITEMS[k].desc };
        const el = document.createElement("div"); el.className = "row " + s.estado;
        const d = document.createElement("span"); d.className = "d";
        const t = document.createElement("div");
        const b = document.createElement("b"); b.textContent = ITEMS[k].name;
        const n = document.createElement("span"); n.textContent = s.nota || ITEMS[k].desc;
        t.append(b, n); el.append(d, t); return el;
      };
      nodes.push(h("Esenciales"));
      CORE.forEach(k => nodes.push(row(k)));
      nodes.push(h("Opcionales"));
      ["material", "reglas", "ejemplos"].forEach(k => nodes.push(row(k)));
      const ws = warnings(draft.trim() ? draft : (chat ? chat.request : ""));
      if (ws.length) {
        nodes.push(h("Para mejorar"));
        const ul = document.createElement("ul"); ul.className = "tips";
        ws.forEach(([b, rest]) => { const li = document.createElement("li"); const s = document.createElement("b"); s.textContent = b; li.append(s, rest); ul.append(li); });
        nodes.push(ul);
      }
      detailEl.replaceChildren(...nodes);
    }
    detailEl.hidden = !detailOpen;

    const ws = warnings(draft);
    hintEl.replaceChildren();
    if (ws.length) { const b = document.createElement("b"); b.textContent = ws[0][0]; hintEl.append(b, ws[0][1]); }
    else if (!hasText) hintEl.textContent = "Contexto, Tarea y Entrega se marcan mientras escribes.";
    else if (!draft.trim() && lastResult && lastResult.questions.some(q => q.state === "pending")) hintEl.textContent = "Responde las preguntas de arriba o escribe más detalles aquí.";
    else if (CORE.every(k => c[k].estado === "ok")) hintEl.textContent = draft.trim() ? "Tiene lo esencial. Envíalo para armar el prompt." : "Tiene lo esencial. Cópialo o sigue agregando detalles.";
    else { const miss = CORE.find(k => c[k].estado !== "ok"); hintEl.textContent = c[miss].nota; }

    sendBtn.disabled = !draft.trim();
  }

  function autosize() { draftEl.style.height = "auto"; draftEl.style.height = Math.min(draftEl.scrollHeight, window.innerHeight * 0.38) + "px"; }

  // ---------- Conversación ----------
  function setChatting(on) {
    app.classList.toggle("chatting", on);
    hero.hidden = on; foot.hidden = on; thread.hidden = !on;
    $("btn-reset").hidden = !on;

  }
  function addUser(text) {
    const d = document.createElement("div"); d.className = "u"; d.textContent = text;

    thread.append(d);
  }
  function scrollDown() { requestAnimationFrame(() => window.scrollTo({ top: document.body.scrollHeight, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" })); }

  const COPY_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
  function copyButton(getText, pre) {
    const b = document.createElement("button"); b.type = "button"; b.className = "pill-btn";
    const set = (txt) => { b.innerHTML = COPY_ICON; b.append(txt); };
    set("Copiar");
    b.onclick = async () => {
      try { await navigator.clipboard.writeText(getText()); set("Copiado"); }
      catch { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); set("Ctrl+C para copiar"); }
      setTimeout(() => set("Copiar"), 1800);

    return b;
  }
  function promptPre(text) {
    const pre = document.createElement("pre");
    text.split(/(\[[^\]\n]{1,120}\])/).forEach(part => {
      if (/^\[.*\]$/.test(part)) { const s = document.createElement("span"); s.className = "hole"; s.textContent = part; pre.append(s); }
      else pre.append(document.createTextNode(part));
    });
    return pre;
  }
  function resultCard(title, text, extraBtn, cls) {
    const wrap = document.createElement("div"); wrap.className = "result" + (cls ? " " + cls : "");
    const head = document.createElement("div"); head.className = "result-head";
    const lab = document.createElement("span"); lab.className = "label"; lab.textContent = title;
    const pre = promptPre(text);
    const actions = document.createElement("div"); actions.className = "result-actions";
    if (extraBtn) actions.append(extraBtn);
    actions.append(copyButton(() => text, pre));
    head.append(lab, actions); wrap.append(head, pre);
    return wrap;
  }

  // Tarjeta de un turno. Interactiva solo en el último turno del chat.
  function buildCard(turn, r, interactive) {
    const d = document.createElement("div"); d.className = "a";
    const m = document.createElement("span"); m.className = "mark"; m.setAttribute("aria-hidden", "true");
    const body = document.createElement("div");
    const pending = r ? r.questions.filter(q => q.state === "pending") : [];
    const t = document.createElement("div"); t.className = "text";
    t.textContent = !r ? "Así quedó tu prompt."
      : !interactive ? "Así quedó tu prompt en este paso."
      : pending.length ? "Esto entendí. Responde lo que falta y el prompt se completa solo."
      : "Listo, tiene lo esencial. Cópialo o agrega más detalles abajo.";
    body.append(t);

    if (r) {
      // Entendí
      const und = document.createElement("div"); und.className = "understood";
      const lab = document.createElement("span"); lab.className = "label"; lab.textContent = "Entendí";
      und.append(lab);
      if (interactive) {
        const wrap = document.createElement("span"); wrap.className = "select-wrap";
        const sel = document.createElement("select"); sel.id = "type-select"; sel.setAttribute("aria-label", "Tipo de pedido");
        Engine.types().forEach(tp => { const o = document.createElement("option"); o.value = tp.key; o.textContent = tp.label; if (tp.key === r.type) o.selected = true; sel.append(o); });
        sel.onchange = () => { chat.type = sel.value === r.autoType && !chat.type ? null : sel.value; refreshLive("type-select"); };
        wrap.append(sel); und.append(wrap);
      } else { const tg = document.createElement("span"); tg.className = "tag type"; tg.textContent = r.typeLabel; und.append(tg); }
      r.understood.forEach(u => { const tg = document.createElement("span"); tg.className = "tag"; tg.textContent = u; tg.title = u; und.append(tg); });
      body.append(und);

      // Preguntas
      if (interactive && r.questions.length) {
        const qs = document.createElement("div"); qs.className = "qs";
        const shownPending = pending.slice(0, 3).map(q => q.key);
        r.questions.filter(q => q.state !== "pending" || shownPending.includes(q.key)).forEach(q => qs.append(questionBlock(q)));
        if (pending.length > 3) { const more = document.createElement("p"); more.className = "q-note"; more.style.margin = "0"; more.textContent = "Hay " + (pending.length - 3) + " pregunta" + (pending.length - 3 === 1 ? "" : "s") + " más después de estas."; qs.append(more); }
        body.append(qs);
      }

      // Cambios aplicados
      if (r.changes.length) {
        const det = document.createElement("details"); det.className = "changes";
        const sum = document.createElement("summary"); sum.textContent = "Qué ajusté (" + r.changes.length + ")";
        const ul = document.createElement("ul");
        r.changes.forEach(c => { const li = document.createElement("li"); li.textContent = c; ul.append(li); });
        det.append(sum, ul); body.append(det);
      }
    }

    // Prompt + comparar con Claude
    const promptText = r ? r.prompt : turn.prompt;
    let cmpBtn = null;
    if (interactive && sampleFn !== null) {
      cmpBtn = document.createElement("button"); cmpBtn.type = "button"; cmpBtn.className = "line-btn"; cmpBtn.id = "cmp-btn";
      cmpBtn.textContent = turn.claude ? "Comparar de nuevo" : "Comparar con Claude";
      cmpBtn.onclick = () => compareWithClaude(turn, r, cmpBtn);
    }
    body.append(resultCard("Prompt", promptText || "", cmpBtn));
    if (turn.claude) body.append(resultCard("Versión de Claude", turn.claude, null, "claude"));
    d.append(m, body);
    return d;
  }

  function questionBlock(q) {
    const box = document.createElement("div");
    const lab = document.createElement("p"); lab.className = "q-label"; lab.textContent = q.q;
    box.append(lab);
    const opts = document.createElement("div"); opts.className = "opts";
    const isMat = q.key === "material";
    if (isMat) {
      const note = document.createElement("p"); note.className = "q-note"; note.textContent = "Pégalo en la caja de abajo y lo pongo arriba del prompt, dentro de <material>.";
      box.append(note);
    }
    const presetHit = q.value && q.opts.includes(q.value);
    q.opts.forEach((o, i) => {
      if (isMat) return;
      const b = document.createElement("button"); b.type = "button"; b.className = "opt"; b.id = "q-" + q.key + "-" + i; b.textContent = o;
      b.setAttribute("aria-pressed", String(q.value === o));
      b.onclick = () => { setAnswer(q.key, q.value === o ? null : o, b.id); };
      opts.append(b);
    });
    if (!isMat) {
      const other = document.createElement("button"); other.type = "button"; other.className = "opt"; other.id = "q-" + q.key + "-other";
      const custom = q.value && !presetHit;
      other.textContent = custom ? q.value : "Otro…";
      other.setAttribute("aria-pressed", String(!!custom));
      other.onclick = () => {
        let row = box.querySelector(".other");
        if (row) { row.remove(); return; }
        row = document.createElement("div"); row.className = "other";
        const inp = document.createElement("input"); inp.type = "text"; inp.id = "q-" + q.key + "-input"; inp.placeholder = "Escribe tu respuesta"; inp.value = custom ? q.value : "";
        inp.setAttribute("aria-label", q.q);
        const ok = document.createElement("button"); ok.type = "button"; ok.className = "pill-btn"; ok.textContent = "Usar";
        const commit = () => { const v = inp.value.trim(); if (v) setAnswer(q.key, v, other.id); };
        ok.onclick = commit;
        inp.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); commit(); } if (e.key === "Escape") row.remove(); };
        row.append(inp, ok); box.append(row); inp.focus();
      };
      opts.append(other);
    }
    const skip = document.createElement("button"); skip.type = "button"; skip.className = "opt skip"; skip.id = "q-" + q.key + "-skip";
    skip.textContent = isMat ? "Lo pego después" : "Omitir";
    skip.setAttribute("aria-pressed", String(q.state === "skip"));
    skip.onclick = () => setAnswer(q.key, q.state === "skip" ? null : "__skip", skip.id);
    opts.append(skip);
    box.append(opts);
    return box;
  }

  function setAnswer(key, value, focusId) {
    if (!chat) return;
    if (value === null) delete chat.answers[key]; else chat.answers[key] = value;
    refreshLive(focusId);
  }

  // Recalcular la última tarjeta y guardar
  let liveCardEl = null;
  function refreshLive(focusId) {
    if (!chat || !chat.turns.length) return;
    const turn = chat.turns[chat.turns.length - 1];
    const r = Engine.run(chat.request, chat.answers, chat.type);
    lastResult = r;
    turn.prompt = r.prompt; turn.label = r.typeLabel;
    const card = buildCard(turn, r, true);
    if (liveCardEl && liveCardEl.isConnected) liveCardEl.replaceWith(card); else thread.append(card);
    liveCardEl = card;
    if (focusId) { const el = document.getElementById(focusId); if (el) el.focus({ preventScroll: true }); }
    render();
    schedulePersist();
  }

  function renderThread() {
    thread.replaceChildren(); liveCardEl = null; lastResult = null;
    if (!chat) return;
    chat.turns.forEach((turn, i) => {
      addUser(turn.text);
      if (i < chat.turns.length - 1) thread.append(buildCard(turn, null, false));
    });
    if (chat.turns.length) refreshLive();
  }

  function send() {
    const text = draftEl.value.trim();
    if (!text) return;
    if (!chat) {
      const now = Date.now();
      chat = { v: 2, id: "c" + now.toString(36) + Math.random().toString(36).slice(2, 7), title: text.replace(/\s+/g, " ").slice(0, 70), createdAt: now, updatedAt: now, request: "", type: null, answers: {}, turns: [] };
    }
    setChatting(true);
    chat.request = chat.request ? chat.request + "\n\n" + text : text;
    // la tarjeta anterior queda congelada
    if (liveCardEl && chat.turns.length) { const prev = chat.turns[chat.turns.length - 1]; const frozen = buildCard(prev, null, false); liveCardEl.replaceWith(frozen); liveCardEl = null; }
    chat.turns.push({ text });
    addUser(text);
    draftEl.value = ""; autosize(); detailOpen = false;
    refreshLive();
    persistNow();
    scrollDown();
    draftEl.focus();
  }

  // ---------- Comparar con Claude (opcional) ----------
  const CMP_ERRORS = {
    not_granted: "Claude no tiene permiso en esta página. El prompt de arriba no cambia.",
    sampling_disabled: "Claude no está disponible para tu cuenta. El prompt de arriba no cambia.",
    rate_limited: "Llegaste a tu límite de uso de Claude. Vuelve a intentarlo más tarde.",
    session_expired: "Tu sesión de Claude expiró. Inicia sesión de nuevo y vuelve a intentarlo.",
    prompt_too_large: "El texto supera el límite para comparar. Acorta el material.",
    refused: "Claude no procesó este pedido. El prompt de arriba no cambia.",
    empty_completion: "Claude no devolvió texto. Vuelve a intentarlo.",
    upstream_error: "Se perdió la conexión con Claude. Vuelve a intentarlo."
  };
  async function compareWithClaude(turn, r, btn) {
    if (!sampleFn) return;
    btn.disabled = true; btn.textContent = "Comparando…"; btn.classList.add("shimmer");
    const instr = `Eres editor de prompts para Claude. Mejora la redacción de este prompt según estas prácticas: contexto (quién es, para quién y para qué), tarea con verbo de acción, entrega (formato, extensión, tono, qué es terminado), material largo arriba dentro de <material>, reglas en positivo y con su porqué, sin mayúsculas ni urgencia, sin "piensa paso a paso". No inventes datos: deja los huecos entre [corchetes] tal cual. Mantén la estructura Contexto / Tarea / Entrega (y Reglas si existen). Responde solo con el prompt mejorado, sin comentarios.

Pedido original del usuario:
"""
${chat.request.slice(0, 20000)}
"""

Prompt armado por reglas:
"""
${r.prompt.slice(0, 20000)}
"""`;
    try {
      const res = await sampleFn(instr, { cache: false });
      turn.claude = res.text.trim().replace(/^```[a-z]*\n?|```$/g, "").trim();
      refreshLive("cmp-btn");
      persistNow();
    } catch (e) {
      const code = e && e.code;
      btn.disabled = false; btn.classList.remove("shimmer"); btn.textContent = "Comparar con Claude";
      if (["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(code)) { sampleFn = null; btn.remove(); }
      hintEl.textContent = CMP_ERRORS[code] || CMP_ERRORS.upstream_error;
    }
  }
  const samplePromise = (window.claude && window.claude.use) ? window.claude.use("sample").catch(() => null) : Promise.resolve(null);
  samplePromise.then(s => { sampleFn = s || null; if (!s) { const b = document.getElementById("cmp-btn"); if (b) b.remove(); } });

  // ---------- Historial: almacenamiento ----------
  const LS_KEY = "pulidor-chats";
  let chats = [];
  const cache = new Map();
  let store = null, storeReady = Promise.resolve();

  function migrate(c) {
    if (!c || c.v === 2) return c;
    const msgs = c.messages || [];
    const turns = [];
    for (const m of msgs) {
      if (m.role === "user") turns.push({ text: m.content });
      else if (turns.length && m.prompt) turns[turns.length - 1].prompt = m.prompt;
    }
    return { v: 2, id: c.id, title: c.title, createdAt: c.createdAt, updatedAt: c.updatedAt, request: msgs.filter(m => m.role === "user").map(m => m.content).join("\n\n"), type: null, answers: {}, turns };
  }

  const lsRead = () => { try { return JSON.parse(localStorage.getItem(LS_KEY) || "[]"); } catch { return []; } };
  const lsWrite = (arr) => { try { localStorage.setItem(LS_KEY, JSON.stringify(arr)); return true; } catch { return false; } };
  const localStore = {
    kind: "local",
    async save(c) { const arr = lsRead().filter(x => x.id !== c.id); arr.unshift(c); if (!lsWrite(arr.slice(0, 200))) throw { code: "local_full" }; refreshLocalList(); },
    async saveMany(list) { const ids = new Set(list.map(c => c.id)); const arr = [...list, ...lsRead().filter(x => !ids.has(x.id))]; if (!lsWrite(arr.slice(0, 200))) throw { code: "local_full" }; refreshLocalList(); },
    async list() { return lsRead(); },
    async remove(id) { lsWrite(lsRead().filter(x => x.id !== id)); refreshLocalList(); },
    async load(id) { return lsRead().find(x => x.id === id) || null; }
  };
  function refreshLocalList() {
    const arr = lsRead();
    arr.forEach(c => cache.set(c.id, c));
    chats = arr.map(c => ({ id: c.id, title: c.title, updatedAt: c.updatedAt })).sort((a, b) => b.updatedAt - a.updatedAt);
    renderChats();
  }

  async function initStore() {
    // App de Mac: historial en un archivo dentro de la carpeta de datos de la app
    if (IS_APP) {
      let data = { v: 2, chats: [] };
      try { const p = JSON.parse(await TAURI.core.invoke("load_history")); if (p && Array.isArray(p.chats)) data = p; }
      catch { hintEl.textContent = "No pude leer el historial guardado. Tus prompts nuevos se guardarán igual."; }
      const all = new Map(data.chats.map(migrate).filter(Boolean).map(c => [c.id, c]));
      const writeAll = () => TAURI.core.invoke("save_history", { data: JSON.stringify({ v: 2, savedAt: Date.now(), chats: [...all.values()] }) });
      const refresh = () => {
        all.forEach(c => cache.set(c.id, c));
        chats = [...all.values()].map(c => ({ id: c.id, title: c.title, updatedAt: c.updatedAt })).sort((a, b) => b.updatedAt - a.updatedAt);
        renderChats();
      };
      store = {
        kind: "mac",
        async save(c) { all.set(c.id, c); await writeAll(); refresh(); },
        async saveMany(list) { list.forEach(c => all.set(c.id, c)); await writeAll(); refresh(); },
        async remove(id) { all.delete(id); await writeAll(); refresh(); },
        async load(id) { return all.get(id) || null; },
        async list() { return [...all.values()]; }
      };
      refresh(); renderStoreNote();
      return;
    }
    const use = window.claude && window.claude.use;
    let db = null, uid = null;
    if (use) {
      try { const [d, u] = await Promise.all([use("db"), use("user")]); db = d; uid = u ? await u.id() : null; }
      catch { db = null; }
    }
    if (db && uid) {
      try {
        const col = db.doc("data/users/" + uid + "/pulidor").collection("chats");
        store = {
          kind: "cuenta",
          async save(c) { await col.doc(c.id).set(c); },
          async saveMany(list) { for (const c of list) await col.doc(c.id).set(c); },
          async remove(id) { await col.doc(id).delete(); },
          async load(id) { const s = await col.doc(id).get(); return s.exists ? s.data() : null; },
          async list() { const snap = await col.get(); return snap.docs.map(s => s.data()); }
        };
        col.orderBy("updatedAt", "desc").limit(200).onSnapshot((snap) => {
          chats = snap.docs.map(s => { const d = s.data(); cache.set(s.id, d); return { id: s.id, title: d.title, updatedAt: d.updatedAt }; });
          renderChats();
        }, () => { store = localStore; refreshLocalList(); renderStoreNote(); });
        renderStoreNote();
        return;
      } catch { /* cae al navegador */ }
    }
    store = localStore;
    refreshLocalList();
    renderStoreNote();
  }
  function renderStoreNote() {
    $("store-note").textContent = !store ? "Cargando historial…"
      : store.kind === "mac" ? "Se guarda en tu Mac. Las actualizaciones no lo borran."
      : store.kind === "cuenta" ? "Se guarda en tu cuenta de Claude, privado para ti."
      : "Se guarda en este navegador. Si borras sus datos, se pierde.";
  }

  // ---------- Exportar / importar historial ----------
  let downloadsApi = null;
  async function setupExport() {
    if (IS_APP) { $("btn-export").hidden = false; return; }
    try { downloadsApi = window.claude && window.claude.use ? await window.claude.use("downloads") : null; } catch { downloadsApi = null; }
    $("btn-export").hidden = !downloadsApi;
  }
  $("btn-export").onclick = async () => {
    await storeReady;
    if (chat) await persistNow();
    let list = [];
    try { list = store && store.list ? await store.list() : []; } catch { list = []; }
    if (!list.length) { hintEl.textContent = "Aún no hay prompts para exportar."; setDrawer(false); return; }
    const data = JSON.stringify({ v: 2, app: "pulidor-de-prompts", exportedAt: Date.now(), chats: list.map(migrate) }, null, 2);
    try {
      if (IS_APP) {
        const path = await TAURI.core.invoke("export_history", { data });
        showBanner("Exporté " + list.length + (list.length === 1 ? " prompt a " : " prompts a ") + path.replace(/^.*\/(Downloads|Descargas)\//, "Descargas/") + ".");
      } else if (downloadsApi) {
        await downloadsApi.save({ filename: "pulidor-historial.json", data });
        showBanner("Listo. Importa ese archivo en la app de Mac para llevar tu historial.");
      }
    } catch { showBanner("No se pudo exportar el historial. Vuelve a intentarlo."); }
  };
  $("btn-import").onclick = () => $("import-file").click();
  $("import-file").onchange = async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    let parsed;
    try { parsed = JSON.parse(await file.text()); } catch { showBanner("Ese archivo no es un historial válido. Usa el que exportaste desde el Pulidor."); return; }
    const list = (Array.isArray(parsed) ? parsed : parsed && parsed.chats || []).map(migrate).filter(c => c && c.id && Array.isArray(c.turns));
    if (!list.length) { showBanner("No encontré prompts en ese archivo."); return; }
    await storeReady;
    try { await store.saveMany(list); list.forEach(c => cache.set(c.id, c)); renderChats(); showBanner("Importé " + list.length + (list.length === 1 ? " prompt." : " prompts.")); }
    catch { showBanner("No se pudo importar. Vuelve a intentarlo."); }
  };

  // ---------- Avisos ----------
  let bannerTimer = null;
  function showBanner(text, actions = []) {
    clearTimeout(bannerTimer);
    $("banner-text").textContent = text;
    $("banner-actions").replaceChildren(...actions);
    $("banner").hidden = false;
    if (!actions.length) bannerTimer = setTimeout(() => { $("banner").hidden = true; }, 5000);
  }
  function hideBanner() { $("banner").hidden = true; }

  // ---------- Actualizaciones (solo app de Mac) ----------
  let appVersion = "";
  async function setupUpdates() {
    if (!IS_APP) return;
    try { appVersion = await TAURI.app.getVersion(); } catch { appVersion = ""; }
    $("app-version").textContent = appVersion ? "Versión " + appVersion : "";
    $("app-meta").hidden = false;
    $("btn-update").onclick = () => checkUpdate(true);
    setTimeout(() => checkUpdate(false), 4000);
  }
  async function checkUpdate(manual) {
    if (!TAURI || !TAURI.updater) { if (manual) showBanner("Las actualizaciones no están disponibles en esta versión."); return; }
    const btn = $("btn-update");
    if (manual) { btn.disabled = true; btn.textContent = "Buscando…"; }
    try {
      const upd = await TAURI.updater.check();
      if (!upd) { if (manual) showBanner("Tienes la última versión."); return; }
      const go = document.createElement("button"); go.type = "button"; go.className = "pill-btn"; go.textContent = "Actualizar";
      const later = document.createElement("button"); later.type = "button"; later.className = "line-btn"; later.textContent = "Después";
      later.onclick = hideBanner;
      go.onclick = () => installUpdate(upd);
      showBanner("Hay una versión nueva: " + upd.version + ".", [later, go]);
    } catch {
      if (manual) showBanner("No se pudo buscar actualizaciones. Revisa tu conexión a internet.");
    } finally {
      if (manual) { btn.disabled = false; btn.textContent = "Buscar actualización"; }
    }
  }
  async function installUpdate(upd) {
    try {
      if (chat) await persistNow();
      await TAURI.core.invoke("backup_history", { label: appVersion || "anterior" });
      let total = 0, got = 0;
      showBanner("Descargando la versión " + upd.version + "…", []);
      await upd.downloadAndInstall((ev) => {
        if (ev.event === "Started") total = ev.data.contentLength || 0;
        if (ev.event === "Progress") { got += ev.data.chunkLength; if (total) $("banner-text").textContent = "Descargando la versión " + upd.version + "… " + Math.round(got / total * 100) + "%"; }
        if (ev.event === "Finished") $("banner-text").textContent = "Instalando…";
      });
      showBanner("Listo. Reiniciando la app…", []);
      await TAURI.process.relaunch();
    } catch {
      showBanner("No se pudo instalar la actualización. Tu historial está intacto; vuelve a intentarlo más tarde.");
    }
  }

  let persistTimer = null;
  function schedulePersist() { clearTimeout(persistTimer); persistTimer = setTimeout(persistNow, 700); }
  async function persistNow(c = chat) {
    clearTimeout(persistTimer);
    if (!c) return;
    c.updatedAt = Date.now();
    if (c.turns.length > 40) c.turns = c.turns.slice(-40);
    const copy = JSON.parse(JSON.stringify(c));
    cache.set(c.id, copy);
    await storeReady;
    if (!store) return;
    try { await store.save(copy); }
    catch (e) {
      hintEl.textContent = e && e.code === "quota_exceeded"
        ? "El historial está lleno. Elimina algunos prompts antiguos para seguir guardando."
        : "No se pudo guardar en el historial. Se reintentará con tu próximo cambio.";
    }
  }

  // ---------- Historial: panel ----------
  const fmtTime = (ts) => new Date(ts).toLocaleTimeString("es-PE", { hour: "2-digit", minute: "2-digit" });
  const fmtDate = (ts) => new Date(ts).toLocaleDateString("es-PE", { day: "numeric", month: "short" });
  function groupOf(ts) {
    const d = new Date(ts), now = new Date();
    const start = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
    const diff = Math.round((start(now) - start(d)) / 864e5);
    return diff === 0 ? "Hoy" : diff === 1 ? "Ayer" : diff < 7 ? "Esta semana" : "Anteriores";
  }
  function renderChats() {
    const ul = $("chats");
    if (!chats.length) {
      const li = document.createElement("li"); li.className = "empty";
      li.textContent = "Aún no hay prompts guardados. Los que armes aparecerán aquí.";
      ul.replaceChildren(li); return;
    }
    const nodes = []; let last = "";
    for (const c of chats) {
      const g = groupOf(c.updatedAt);
      if (g !== last) { const h = document.createElement("li"); h.className = "group"; h.textContent = g; nodes.push(h); last = g; }
      const li = document.createElement("li"); li.className = "chat" + (chat && chat.id === c.id ? " active" : "");
      const open = document.createElement("button"); open.type = "button"; open.className = "open-chat";
      const t = document.createElement("span"); t.className = "t"; t.textContent = c.title || "Sin título";
      const w = document.createElement("span"); w.className = "when"; w.textContent = g === "Hoy" || g === "Ayer" ? fmtTime(c.updatedAt) : fmtDate(c.updatedAt);
      open.append(t, w);
      open.onclick = () => openChat(c.id);
      const del = document.createElement("button"); del.type = "button"; del.className = "del"; del.textContent = "Eliminar";
      del.setAttribute("aria-label", "Eliminar " + (c.title || "prompt"));
      del.onclick = async () => {
        if (!del.classList.contains("confirm")) {
          del.classList.add("confirm"); del.textContent = "¿Eliminar?";
          setTimeout(() => { if (del.isConnected) { del.classList.remove("confirm"); del.textContent = "Eliminar"; } }, 3000);
          return;
        }
        try { await store.remove(c.id); cache.delete(c.id); if (chat && chat.id === c.id) newChat(); }
        catch { hintEl.textContent = "No se pudo eliminar. Vuelve a intentarlo."; }
      };
      li.append(open, del); nodes.push(li);
    }
    ul.replaceChildren(...nodes);
  }

  const drawer = $("drawer"), scrim = $("scrim"), histBtn = $("btn-history");
  function setDrawer(open) {
    drawer.classList.toggle("open", open); scrim.classList.toggle("open", open);
    histBtn.setAttribute("aria-expanded", String(open));
    if (open) { renderChats(); $("btn-new").focus(); } else histBtn.focus();
  }
  histBtn.onclick = () => setDrawer(true);
  $("btn-close").onclick = () => setDrawer(false);
  scrim.onclick = () => setDrawer(false);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && drawer.classList.contains("open")) setDrawer(false); });
  $("btn-new").onclick = () => { newChat(); setDrawer(false); };

  async function openChat(id) {
    let c = cache.get(id);
    if (!c && store) { try { c = await store.load(id); } catch { c = null; } }
    if (!c) { hintEl.textContent = "No se encontró ese prompt."; return; }
    if (chat) await persistNow();
    chat = migrate(JSON.parse(JSON.stringify(c)));
    detailOpen = false; draftEl.value = ""; autosize();
    setChatting(true); renderThread(); render(); setDrawer(false); scrollDown();
  }
  async function newChat() {
    if (chat) await persistNow();
    chat = null; lastResult = null; liveCardEl = null; detailOpen = false; thread.replaceChildren(); draftEl.value = ""; autosize();
    setChatting(false); render(); renderChats(); draftEl.focus();
  }

  // ---------- Eventos ----------
  $("composer").addEventListener("submit", (e) => { e.preventDefault(); send(); });
  const coarse = matchMedia("(pointer: coarse)").matches;
  draftEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing && (!coarse || e.ctrlKey || e.metaKey)) { e.preventDefault(); send(); }
  });
  draftEl.addEventListener("input", () => { autosize(); render(); });
  $("btn-reset").addEventListener("click", newChat);

  // ---------- Tema claro / oscuro ----------
  const root = document.documentElement, themeBtn = $("btn-theme");
  const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
  const isDark = () => root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  function paintThemeBtn() {
    const dark = isDark();
    themeBtn.innerHTML = dark ? SUN : MOON;
    themeBtn.setAttribute("aria-label", dark ? "Cambiar a modo claro" : "Cambiar a modo oscuro");
    themeBtn.title = dark ? "Modo claro" : "Modo oscuro";
  }
  try { const saved = localStorage.getItem("pulidor-theme"); if (saved === "dark" || saved === "light") root.dataset.theme = saved; } catch {}
  themeBtn.addEventListener("click", () => {
    const next = isDark() ? "light" : "dark";
    root.dataset.theme = next;
    try { localStorage.setItem("pulidor-theme", next); } catch {}
    paintThemeBtn();
  });
  const mq = matchMedia("(prefers-color-scheme: dark)");
  if (mq.addEventListener) mq.addEventListener("change", paintThemeBtn);
  paintThemeBtn();

  setChatting(false);
  render();
  renderChats();
  storeReady = initStore().catch(() => { store = localStore; refreshLocalList(); renderStoreNote(); });
  setupExport();
  setupUpdates();
})();
</script>

</body>
</html>
