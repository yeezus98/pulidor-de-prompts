[package]
name = "pulidor-de-prompts"
version = "0.1.0"
description = "Optimizador de prompts para Claude con motor de reglas"
edition = "2021"

[lib]
name = "pulidor_de_prompts_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
